[package]
name = "dexhowto_recorder"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
eframe = "0.36.2"
muda = { version = "0.21.2", default-features = false }
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
screencapturekit = { version = "11.0.0", features = ["macos_15_0"] }

[target.'cfg(windows)'.dependencies]
cpal = "0.18"
windows-capture = "2.0.1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
