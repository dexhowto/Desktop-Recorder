[package]
name = "dexhowto_recorder"
version = "0.1.0"
edition = "2024"

[dependencies]
block2 = "0.6"
chrono = "0.4.45"
eframe = "0.36.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
muda = { version = "0.21.2", default-features = false }
rfd = "0.17.2"
screencapturekit = { version = "11.0.0", features = ["macos_15_0"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tray-icon = { version = "0.26.1", default-features = false }
